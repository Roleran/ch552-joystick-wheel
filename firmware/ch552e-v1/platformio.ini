; CH552E 单摇杆。内部 24MHz，用户代码 14KB，USB 缓冲占用 xram 前 148 字节。
; 烧录文件是 .pio/build/ch552/firmware.hex，用 WCHISPTool 选择 CH552 下载。

[platformio]
default_envs = ch552
boards_dir = boards

[env:ch552]
platform = intel_mcs51
board = CH552
upload_protocol = custom
upload_command = echo Flash ch552e-v1.hex with WCHISPTool
extra_scripts =
  pre:apply_ch552_pre.py
  post:apply_ch552.py
